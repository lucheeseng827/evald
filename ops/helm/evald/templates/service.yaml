{{- include "evald.guards" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evald.fullname" . }}
  labels:
    {{- include "evald.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "evald.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    {{- if .Values.service.grpc }}
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    {{- end }}
---
# The StatefulSet's governing Service (stable pod DNS); not for clients.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evald.fullname" . }}-headless
  labels:
    {{- include "evald.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "evald.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
