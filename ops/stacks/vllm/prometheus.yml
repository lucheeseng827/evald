global:
  scrape_interval: 15s

scrape_configs:
  - job_name: evald
    static_configs:
      - targets: ["evald:4318"]
    # With EVALD_AUTH_TOKEN set, /metrics is behind the gate too:
    # authorization:
    #   credentials: <the token>
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
