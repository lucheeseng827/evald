# evald CI — runs on the PUBLIC mirror (lucheeseng827/evald).
#
# Synced from the private monorepo to `.github/workflows/ci.yml` (see .ossync.yaml). Guards the
# Apache core on every push / PR: formatting, lints, the test suite, and a static-musl release
# build (the exact target the binary ships as). The default build is pure-Rust with no C/network
# deps, so a single Ubuntu runner covers it.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and no job keeps the token in .git/config: the recipe jobs install and run
# third-party packages (the frameworks, LiteLLM), which could read it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      # The Tier-3 LLM-as-judge backend is behind the `judge` feature (off by default). Compile
      # + lint it so it can't silently break; its logic is unit-tested with a mock in the
      # default build, and it makes no network call here.
      - name: Clippy (judge feature)
        run: cargo clippy --all-targets --features judge -- -D warnings
      # "No outbound call in the default build", checked from the resolved dependency graph and
      # the source rather than stated. The selftest proves the check can fail: the opt-in judge
      # build carries reqwest + rustls and must be flagged.
      - name: No network client in the default build
        run: |
          scripts/check-no-network.sh
          scripts/check-no-network.sh --selftest
      - name: Every relative doc link resolves
        run: python3 scripts/check-doc-links.py .
      - name: install.sh lints
        run: shellcheck -s sh install.sh

  # A backup nobody has restored is a cron job producing files. This runs the documented
  # recovery end to end on every push and asserts the property that matters: a restore
  # loses NOTHING that was ACK'd before the backup point. Loss bounded by backup age is an
  # RPO window; loss inside the backup point is a bug, and this is what would catch it.
  #
  # Verified to fail, not just to pass: omitting the WAL from the backup — the exact
  # mistake docs/OPERATIONS.md warns against — drops spans that were ACK'd before the
  # backup, and the drill exits non-zero.
  restore-drill:
    name: backup / restore drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary the drill drives
        run: cargo build --bin evald
      - name: Restore drill
        run: ops/restore-drill.sh target/debug/evald

  # PLAN.md §6's GA gate, and the project's own stated single biggest storage risk: sustained
  # ingest + repeated kill -9 + compaction under load, with fsync-correctness verification.
  # tests/crash_recovery.rs covers ONE crash; this covers the failures that only appear after
  # several — a recovery that loses a little each time, a compaction that stops committing once
  # it has been interrupted, a dedup that double-counts only after both tiers have been rebuilt.
  #
  # The run here is deliberately short so it gates every push. The GA gate is the same test at
  # the duration in docs/SOAK.md; the assertions do not change with the clock.
  #
  # Verified to fail, not just to pass — all four properties were induced and caught
  # (docs/SOAK.md "Proving the gate can refuse").
  soak:
    name: soak — sustained ingest + kill -9 + compaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Soak
        env:
          EVALD_SOAK_SECS: "45"
          EVALD_SOAK_CYCLES: "3"
          EVALD_SOAK_WORKERS: "4"
          # NOT the test's own default of 20. At 20 a 45s run commits ~3,200 blocks, and the
          # cold-tier read path opens one file per block, so on a runner with the common
          # `ulimit -n 1024` the recovery query dies with EMFILE — the C13a ceiling this gate
          # found, not a durability failure, but a red job either way. 500 keeps the run to
          # ~150 blocks while still committing tens of them per cycle, so property 4 has
          # plenty to assert on. See docs/SOAK.md.
          EVALD_SOAK_SEAL: "500"
        run: |
          echo "fd limit on this runner: $(ulimit -n)"
          cargo test --test soak -- --ignored --nocapture

  musl:
    name: static musl build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (static musl)
        run: cross build --release --bin evald --target x86_64-unknown-linux-musl
      - name: Smoke-test the binary
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/evald
          "$bin" version
          # Confirm it is a static binary (no dynamic interpreter).
          file "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: evald-musl
          path: target/x86_64-unknown-linux-musl/release/evald
          retention-days: 1

  # 0.4.0's release bar: a clean machine to a coding agent's first session in three commands,
  # by the README's own quick start. A bare ubuntu container (no Rust, no clone) runs the README's
  # lines as written, installing the static binary above through install.sh, then a real
  # Claude Code whose model calls go to the recipes' stub provider (no key, no network), and
  # requires the session it made: a model call with its model, tokens and cost.
  # scripts/clean-machine.py says what it stands in for and what it checks after each line.
  clean-machine:
    name: clean machine — the README quick start on bare ubuntu
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evald-musl
          path: bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The README quick start on ubuntu:24.04
        run: python3 scripts/clean-machine.py --evald bin/evald

  # Each framework recipe (examples/recipes/<name>) run end to end: the framework's real agent
  # loop against the stub provider (no key, no network), its telemetry into a real evald, then
  # check.py asserts evald's reading of it — model, tokens, cost on the model calls, the tool
  # call under its canonical name, and no usage on any other span. A framework release that
  # renames an attribute, or an evald change that misreads one, fails here.
  recipes-build:
    name: recipes — build evald
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --bin evald
      - uses: actions/upload-artifact@v4
        with:
          name: evald-debug
          path: target/debug/evald
          retention-days: 1

  recipes:
    name: recipe — ${{ matrix.recipe }}
    needs: recipes-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [langgraph, openai-agents, pydantic-ai, crewai, litellm-proxy, vercel-ai-sdk, claude-agent-sdk]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evald-debug
          path: bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the recipe
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          chmod +x bin/evald
          EVALD="$PWD/bin/evald" sh examples/recipes/run.sh "$RECIPE"
